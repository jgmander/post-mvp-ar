name: Deploy Firebase (Rules, Indexes & Hosting)

on:
  push:
    branches:
      - main
    paths:
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'website/**'
  workflow_dispatch:

env:
  PROJECT_ID: dbomar-post-mvp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.SA_EMAIL }}'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules & indexes
        run: firebase deploy --only firestore --project ${{ env.PROJECT_ID }}

      - name: Deploy Hosting (get-post.co / postspatial.web.app)
        run: firebase deploy --only hosting --project ${{ env.PROJECT_ID }}
