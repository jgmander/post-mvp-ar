name: Deploy Android to App Distribution + Play Store

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-android.yml'
  workflow_dispatch:


jobs:
  build_and_distribute:
    runs-on: ubuntu-24.04
    permissions:
      contents: 'write'
      id-token: 'write'
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Auto-bump version code
        working-directory: ${{ github.workspace }}
        run: |
          CURRENT=$(grep "^version:" frontend/pubspec.yaml | grep -o '+[0-9]*' | tr -d '+')
          NEXT=$((CURRENT + 1))
          sed -i "s/version: 1.0.0+${CURRENT}/version: 1.0.0+${NEXT}/" frontend/pubspec.yaml
          echo "VERSION_CODE=${NEXT}" >> $GITHUB_ENV
          git config user.email "ci@post.co"
          git config user.name "GitHub Actions"
          git add frontend/pubspec.yaml
          git commit -m "ci: auto-bump version code to ${NEXT} [skip ci]"
          git push

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks

      # ── Build APK for Firebase App Distribution (fast internal testing) ──
      - name: Build APK (Firebase App Distribution)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=MAPS_API_KEY="${{ secrets.MAPS_API_KEY }}" \
            --dart-define=MAP_ID="${{ secrets.MAP_ID }}" \
            --dart-define=IOS_MAP_ID="${{ secrets.IOS_MAP_ID }}"

      # ── Build AAB for Play Store ──
      - name: Build AAB (Play Store)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --dart-define=MAPS_API_KEY="${{ secrets.MAPS_API_KEY }}" \
            --dart-define=MAP_ID="${{ secrets.MAP_ID }}" \
            --dart-define=IOS_MAP_ID="${{ secrets.IOS_MAP_ID }}"

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.SA_EMAIL }}'
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # ── Distribute APK to Dustin + internal testers via Firebase ──
      - name: Upload APK to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app ${{ secrets.FIREBASE_APP_ID }} \
            --groups "internal-testers"

      # ── Upload AAB to Play Store Internal Track ──
      - name: Upload AAB to Play Store (Internal Track)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.post.spatial
          releaseFiles: frontend/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Clean up Keystore
        if: always()
        run: rm -f android/app/key.jks

      - name: Stamp deploy timestamp to sprint doc
        if: success()
        run: |
          cd ${{ github.workspace }}
          echo "Last Android deploy: $(date -u '+%Y-%m-%d %H:%M UTC') — commit ${{ github.sha }} ✅" >> .agent/current_sprint.md
          git config user.email "ci@post.co"
          git config user.name "GitHub Actions"
          git add .agent/current_sprint.md
          git commit -m "ci: stamp android deploy timestamp [skip ci]" || true
          git push || true
